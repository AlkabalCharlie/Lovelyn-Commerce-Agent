name: Daily Autonomous Grind

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright chromium (tier 3 extraction)
        run: python -m playwright install chromium

      # Safety gate: fail the run if the promotion-authorization gate is
      # missing from the checked-out code. A scheduled run must never execute
      # an older, unrestricted agent that would rebuild the 30-campaign site.
      - name: Verify promotion-authorization gate is present
        run: python -c "import inspect; from database import repositories; assert 'promotion_approved = TRUE' in inspect.getsource(repositories.CampaignRepository.publish_campaign)"

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Run Autonomous Agent
        env:
          SUPABASE_USERNAME: ${{ secrets.SUPABASE_USERNAME }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          LOVELYN_SSL_VERIFY: ${{ secrets.LOVELYN_SSL_VERIFY }}
        run: python run_agent.py

      # P1-11: never commit a Pages deploy that would remove the public site.
      - name: Verify site was built
        run: |
          if [ ! -f docs/index.html ]; then
            echo "::error::docs/index.html missing - the agent failed to build the public site"
            exit 1
          fi

      - name: Commit rebuilt traffic site
        run: |
          git config user.name "lovelyn-agent"
          git config user.email "agent@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: rebuild traffic site"
          git pull --rebase origin main
          git push