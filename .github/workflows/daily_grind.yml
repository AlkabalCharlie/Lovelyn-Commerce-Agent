name: Daily Autonomous Grind

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent
        env:
          SUPABASE_USERNAME: ${{ secrets.SUPABASE_USERNAME }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          LOVELYN_SSL_VERIFY: ${{ secrets.LOVELYN_SSL_VERIFY }}
        run: python run_agent.py

      - name: Commit rebuilt traffic site
        run: |
          git config user.name "lovelyn-agent"
          git config user.email "agent@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: rebuild traffic site"
          git push