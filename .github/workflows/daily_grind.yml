name: Daily Autonomous Grind

on:
  # Run automatically every day at 08:00 UTC
  schedule:
    - cron: '0 8 * * *'
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent
        env:
          SUPABASE_USERNAME: ${{ secrets.SUPABASE_USERNAME }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          LOVELYN_SSL_VERIFY: ${{ secrets.LOVELYN_SSL_VERIFY }}
        run: python run_agent.py